<!-- fakehost — MCP Apps 호스트 흉내. 띄우는 법은 fakehost.py 의 첫 문단에.
     제품 표면이 아니다(브라우저 뷰어는 지웠다) — 규범을 **밟아 보는** 시험대다.
     여기서 고를 수 있는 것: 호스트가 밝히는 모드 목록 × 표시모드 요청에 대한 답. -->
<meta charset="utf-8">
<title>gil 카드 — 가짜 호스트</title>
<style>
 body{font:14px/1.5 -apple-system,sans-serif;margin:0;padding:16px;background:#f4f4f5}
 .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
 button{padding:6px 12px;border-radius:7px;border:1px solid #bbb;background:#fff;cursor:pointer}
 iframe{width:100%;height:520px;border:1px solid #ccc;border-radius:10px;background:#fff}
 #log{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;background:#111;color:#0f0;
      padding:10px;border-radius:8px;height:220px;overflow:auto;margin-top:10px}
</style>
<div class="bar">
  <b>호스트가 밝히는 모드:</b>
  <button data-m="inline">["inline"] (Claude Code 실측)</button>
  <button data-m="inline,fullscreen">["inline","fullscreen"]</button>
  <button data-m="">목록 없음(안 밝힘)</button>
  <b style="margin-left:12px">요청 처리:</b>
  <button data-g="grant">승인</button>
  <button data-g="deny">거절(현재 모드 반환)</button>
  <button data-g="silent">무응답</button>
</div>
<iframe id="f"></iframe>
<div id="log"></div>
<script>
var MODES=["inline"], POLICY="grant", MODE="inline";
var logEl=document.getElementById("log"), f=document.getElementById("f");
function log(s){ logEl.textContent+=s+"\n"; logEl.scrollTop=logEl.scrollHeight; }
function reply(id,result){ f.contentWindow.postMessage({jsonrpc:"2.0",id:id,result:result},"*"); }

window.addEventListener("message",function(e){
  var m=e.data; if(!m||!m.jsonrpc) return;
  log("← "+(m.method||("(응답 id="+m.id+")"))+(m.params?" "+JSON.stringify(m.params).slice(0,160):""));
  if(m.method==="ui/initialize"){
    reply(m.id,{protocolVersion:"2026-01-26",
      hostContext:{theme:"light",displayMode:MODE,availableDisplayModes:MODES.slice(),
                   userAgent:"fake-host",platform:"desktop"},
      hostCapabilities:{serverTools:{},message:{}}});
    return;
  }
  if(m.method==="ui/request-display-mode"){
    if(POLICY==="silent"){ log("  → 무응답(답을 안 보낸다)"); return; }
    if(POLICY==="deny"){ reply(m.id,{mode:MODE}); log("  → 거절: 현재 모드 "+MODE+" 반환"); return; }
    MODE=m.params.mode; reply(m.id,{mode:MODE}); log("  → 승인: "+MODE);
    return;
  }
  if(m.method==="tools/call"){
    reply(m.id,{structuredContent:{cardHtml:
      '<div class="lbl">gil</div><div class="crumb">가짜 카드 — 체인 <span class="sep">›</span> 사이클</div>'+
      '<div class="row"><div class="lbl">받은 host</div><div class="val"><code>'+
      String((m.params.arguments&&m.params.arguments.host)||"(없음)").replace(/</g,"&lt;")+'</code></div></div>'}});
    return;
  }
});
function load(){
  logEl.textContent=""; MODE="inline";
  fetch("shell.html").then(r=>r.text()).then(t=>{ f.srcdoc=t; });
}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
  MODES=b.dataset.m?b.dataset.m.split(","):[]; log("호스트 모드 목록 = "+JSON.stringify(MODES)); load(); });
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
  POLICY=b.dataset.g; log("요청 처리 정책 = "+POLICY); });
load();
</script>

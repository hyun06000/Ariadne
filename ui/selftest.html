<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>GIL Companion — 자동 시험</title>
  <link rel="stylesheet" href="companion.css">
  <style>
    .report { margin: 0; padding: 10px 14px; border-top: 2px solid #566fe8;
              font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .report h2 { font-size: 12px; margin: 0 0 6px; }
    .report li { list-style: none; margin: 2px 0; }
    .report .ok::before { content: "통과  "; color: #2f9e6e; }
    .report .no::before { content: "실패  "; color: #c8645b; }
    .report .no { color: #c8645b; }
    .report .note { opacity: .68; }
  </style>
</head>
<body>
<!--
  이 페이지는 **화면을 새로 짓지 않는다.** `index.html` 이 실제로 띄우는 markup 을 그대로
  가져다 띄우고, 그 위에서 잰다. 두 자리에 적으면 한쪽이 낡는다 — 시험이 진짜 화면과
  다른 화면을 재는 순간 통과는 아무 뜻이 없다.
-->
<script type="module">
  const until = async (has) => {
    for (let tries = 0; tries < 600; tries += 1) {
      const found = has();
      if (found) return found;
      await new Promise((go) => setTimeout(go, 20));
    }
    throw new Error("기다리던 것이 오지 않았다");
  };
  const page = new DOMParser().parseFromString(
    await (await fetch("index.html", { cache: "no-store" })).text(),
    "text/html",
  );
  document.body.prepend(page.getElementById("gil-companion"));
  const report = document.createElement("ol");
  report.className = "report";
  report.innerHTML = "<h2>시험 중…</h2>";
  document.getElementById("gil-companion").appendChild(report);

  // markup 이 선 뒤에야 bundle 을 들인다 — `index.html` 과 같은 순서다.
  const load = (attrs) =>
    new Promise((done, fail) => {
      const tag = Object.assign(document.createElement("script"), attrs);
      tag.onload = done;
      tag.onerror = () => fail(new Error(`${attrs.src} 를 들이지 못했다`));
      document.head.appendChild(tag);
    });
  await load({ src: "host.js" });
  await load({ src: "companion.js", type: "module" });
  await until(() => window.GIL_COMPANION);

  const { run } = await import("./selftest.js");
  const results = await run();
  const failed = results.filter((one) => !one.ok).length;
  report.innerHTML =
    `<h2>${results.length - failed} / ${results.length} 통과` +
    `${failed ? ` · 실패 ${failed}` : ""}</h2>`;
  for (const one of results) {
    const line = document.createElement("li");
    line.className = one.ok ? "ok" : "no";
    const name = document.createElement("span");
    name.textContent = one.name;
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = one.note ? ` — ${one.note}` : "";
    line.append(name, note);
    report.appendChild(line);
  }
  window.GIL_SELFTEST_RESULT = results;
</script>
</body>
</html>

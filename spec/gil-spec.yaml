# GIL Grammar v0.1
#
# 규칙은 코드가 아니라 이 파일이 갖는다.
#
# Step 문법은 **Cycle Kind 안에 산다.** 같은 이름의 Step 이라도 Interview 와 Experiment 에서
# 요구하는 것이 다르기 때문이다 — Interview 의 outcome 은 승인된 Synthesis 를 가리켜야 하고
# success 로만 닫히지만, Experiment 의 outcome 은 failure 로도 닫힌다. 한 자리에 섞어 두면
# 어느 쪽 규칙인지 물을 수 없다.

cycle_kinds:
  # ── Interview — 사용자의 의도를 문장으로 만들고 인간의 승인을 받는다 ──────────
  interview:
    description: 사용자에게 질문해 의도와 판단을 확인한다
    close_requires:
      - verdict
      - outcome_ref
      - handoff_summary
      - next_direction.action
      - next_direction.reason
    field_constraints:
      verdict:
        # Interview Cycle 은 success 로만 닫힌다. 승인을 못 얻었으면 열린 채로 남는다.
        allowed_values:
          - success
        value_descriptions:
          success: 승인된 Synthesis 를 얻어 이 Interview 가 목적을 이뤘다 (Cycle 계층의 판정)
      handoff_summary:
        non_empty: true
      next_direction.action:
        # 명세는 `close_chain` 도 정의하지만 Chain 을 아직 짓지 않았다. 설계에서 지우지 않고
        # **지금 밟을 수 없다는 사실과 까닭**을 함께 둔다 — Chain 이 생기면 여기 한 줄을
        # allowed_values 로 옮긴다.
        allowed_values:
          - open_child
        value_descriptions:
          open_child: 방금 닫은 이 Cycle 을 부모로 다음 Cycle 을 연다 (Cycle 계층의 이동)
        not_yet:
          close_chain: Chain 을 아직 짓지 않았다
      next_direction.reason:
        non_empty: true

    step_kinds:
      question:
        description: 사용자에게 묻고 그 원문 응답을 그대로 받는다
        allowed_parents:
          - cycle_entry
          - interpretation
          - synthesis
        allowed_children:
          - interpretation
        close_requires:
          - question
          - choices
          - response

      interpretation:
        description: 받은 응답에서 확정된 것과 아직 모르는 것을 가른다
        allowed_parents:
          - question
        allowed_children:
          - question
          - synthesis
        close_requires:
          - interpretation
          - unresolved

      synthesis:
        description: 확인한 것을 하나의 제안으로 모아 사람의 승인을 구한다
        allowed_parents:
          - interpretation
        allowed_children:
          - question
          - outcome
        close_requires:
          - statement
          - basis_refs
          - approved
        field_constraints:
          approved:
            allowed_values:
              - "yes"
              - "no"
            value_descriptions:
              "yes": 사람이 이 제안을 승인했다 — 다음 자리는 판정(outcome)뿐이다
              "no": 사람이 승인하지 않았다 — 왜 아닌지 다시 묻는다(question)

      outcome:
        description: 이 Interview 를 판정하고 Cycle 경계로 갈 방향을 정한다
        allowed_parents:
          - synthesis
        allowed_children:
          - cycle_exit
        close_requires:
          - verdict
          - lesson
          - synthesis_ref
          - next_direction.action
          - next_direction.reason
        field_constraints:
          verdict:
            allowed_values:
              - success
            value_descriptions:
              success: 승인된 Synthesis 를 근거로 이 Interview 를 성공으로 판정한다 (Step 계층)
          next_direction.action:
            allowed_values:
              - close_cycle
            value_descriptions:
              close_cycle: >-
                이 Cycle 의 Step Graph 를 끝내고 Cycle Report 경계로 옮겨 선다
                (Step 계층 · Cycle 자체는 아직 열려 있다)
          next_direction.reason:
            non_empty: true

  # ── Experiment — 고정된 Define 아래에서 하나의 가설을 검증한다 ────────────────
  experiment:
    description: 명확한 가설을 실행하고 결과를 검증한다
    close_requires:
      - verdict
      - outcome_ref
      - handoff_summary
      - next_direction.action
      - next_direction.reason
    field_constraints:
      verdict:
        allowed_values:
          - success
          - failure
        value_descriptions:
          success: 이 Cycle 이 제 Define 의 성공 조건을 충족했다 (Cycle 계층의 판정)
          failure: 이 Cycle 이 제 Define 의 성공 조건을 충족하지 못했다 (Cycle 계층의 판정)
      handoff_summary:
        non_empty: true
      next_direction.action:
        allowed_values:
          - open_child
          - revisit
        value_descriptions:
          open_child: 방금 닫은 이 Cycle 을 부모로 다음 Cycle 을 연다 (Cycle 계층의 이동)
          revisit: >-
            형제 Cycle 로 되돌아간다 (Cycle 계층 · 대상은 `cycle:C2` 꼴). 그 이동은 아직
            짓지 않아, 지금은 실패를 확정하는 데서 걷기가 멈춘다
        allowed_values_when:
          verdict:
            success:
              - open_child
            failure:
              - revisit
      next_direction.reason:
        non_empty: true

    step_kinds:
      define:
        description: 이 실험이 풀 문제와 성공 기준을 고정한다
        allowed_parents:
          - cycle_entry
        allowed_children:
          - hypothesis
        close_requires:
          - problem
          - success_condition

      hypothesis:
        description: 검증할 수 있는 원인 후보 하나를 세운다
        allowed_parents:
          - define
          - analysis
        allowed_children:
          - verify
        close_requires:
          - hypothesis
          - rationale
          - guardrail

      verify:
        description: 가설대로 실행하고 결과를 관측한다
        allowed_parents:
          - hypothesis
        allowed_children:
          - analysis
        close_requires:
          - execution
          - result

      analysis:
        description: 관측을 가설과 맞춰 읽는다
        allowed_parents:
          - verify
        allowed_children:
          - hypothesis
          - outcome
        close_requires:
          - hypothesis_fit
          - problem_solved
          - success_condition_met
          - guardrail_triggered
          - interpretation

      outcome:
        description: 이 Cycle 을 판정하고 Cycle 경계로 갈 방향을 정한다
        allowed_parents:
          - analysis
        allowed_children:
          - cycle_exit
        close_requires:
          - verdict
          - lesson
          - next_direction.action
          - next_direction.reason
        field_constraints:
          verdict:
            allowed_values:
              - success
              - failure
            value_descriptions:
              success: 미리 정한 성공 조건이 충족되었다 (Step 계층의 관측 판정)
              failure: 미리 정한 성공 조건이 충족되지 않았다 (Step 계층의 관측 판정)
          next_direction.action:
            allowed_values:
              - revisit
              - close_cycle
            value_descriptions:
              revisit: >-
                이 Cycle 안의 유효한 조상으로 돌아가 새 형제 가설을 시작한다
                (Step 계층 · 대상은 `step:C2/S4` 꼴)
              close_cycle: >-
                이 Cycle 의 Step Graph 를 끝내고 Cycle Report 경계로 옮겨 선다
                (Step 계층 · Cycle 자체는 아직 열려 있다)
            allowed_values_when:
              verdict:
                success:
                  - close_cycle
                failure:
                  - revisit
                  - close_cycle
          next_direction.reason:
            non_empty: true
